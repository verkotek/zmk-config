CONFIG_ZMK_KEYBOARD_NAME="Corne-Yura"

# Set deep sleep to 30 minute
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# Make bluetooth stronger
CONFIG_ZMK_BLE=y
#CONFIG_BT=y
#CONFIG_BT_PERIPHERAL=y
#CONFIG_BT_CENTRAL=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_GATT_CACHING=n

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
#CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BACKLIGHT=n

CONFIG_ZMK_USB=y

CONFIG_ZMK_STUDIO=y
